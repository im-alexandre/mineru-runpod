name: Docs

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs-check-links.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs-check-links.yml"

permissions:
  contents: read

jobs:
  check-links:
    name: Validate internal MDX links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          # Cache npm install based on the docs/ lockfile.
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install docs dependencies
        working-directory: docs
        run: npm ci
      - name: Validate links
        working-directory: docs
        run: npm run check-links

  build:
    # The link check only runs remark, so it passes on a tree the site cannot
    # actually build from. Astro pins @astrojs/markdown-remark to an exact
    # version, and a grouped dependency bump can move astro while leaving the
    # transitive behind — which fails here and nowhere else, because
    # deploy-docs.yml only runs after a merge to main. `npm ci` is what makes
    # that visible: installing into an existing node_modules keeps the old
    # astro and the build appears fine.
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install docs dependencies
        working-directory: docs
        run: npm ci
      - name: Build site
        working-directory: docs
        # Runs the postbuild RSS step too, so a break in that is caught here
        # rather than on the deploy.
        run: npm run build
